<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art of VuTien</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- INTRO -->
<div id="intro">
  <div class="intro-content">
    <img 
      src="https://scontent.fhph1-3.fna.fbcdn.net/v/t39.30808-6/457472370_122172177008100338_7642633868536334426_n.jpg?_nc_cat=102&ccb=1-7&_nc_sid=6ee11a&_nc_eui2=AeHk5ztvuY9AKfQir-eoAwd4K4ZKJ0K_sBcrhkonQr-wF2EMeEJnG8GzxH2ZGs7mFiH2VswwNNcn1RnmONxrI3zB&_nc_ohc=2sdi4fVAPKAQ7kNvwETTkRy&_nc_oc=AdnQaYSnM5nybLhzSyT_7Gswlmo2mADOvFHp92J4bXyacnL-GkebWfhwHlzAxRyQA-E&_nc_zt=23&_nc_ht=scontent.fhph1-3.fna&_nc_gid=2x92MCioutMP_OaSCfNCVQ&oh=00_AfovxNawjTsfb4yZFA0w4Ao0myQ5SWkPWMpzv_ZFmMytLg&oe=69693731"
      alt="Art of VuTien Logo"
      class="intro-logo"
    >
    <h1>Art of VuTien</h1>
    <p>Cầm cọ lên, cùng nhau vẽ nên thế giới đầy màu sắc tại VuTien Art Club</p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <!-- HOME -->
  <section id="home" class="page active">
    <img 
      src="https://scontent.fhph1-3.fna.fbcdn.net/v/t39.30808-6/457472370_122172177008100338_7642633868536334426_n.jpg?_nc_cat=102&ccb=1-7&_nc_sid=6ee11a&_nc_eui2=AeHk5ztvuY9AKfQir-eoAwd4K4ZKJ0K_sBcrhkonQr-wF2EMeEJnG8GzxH2ZGs7mFiH2VswwNNcn1RnmONxrI3zB&_nc_ohc=2sdi4fVAPKAQ7kNvwETTkRy&_nc_oc=AdnQaYSnM5nybLhzSyT_7Gswlmo2mADOvFHp92J4bXyacnL-GkebWfhwHlzAxRyQA-E&_nc_zt=23&_nc_ht=scontent.fhph1-3.fna&_nc_gid=2x92MCioutMP_OaSCfNCVQ&oh=00_AfovxNawjTsfb4yZFA0w4Ao0myQ5SWkPWMpzv_ZFmMytLg&oe=69693731"
      class="logo"
      alt="Logo"
    >
    <h1>VuTien Art Club</h1>
    <p>
      Sẵn sàng trở thành thành viên của gia đình Vũ Tiên Art Club chưa nào!
    </p>
    <button onclick="goTo('form')">Đăng ký ngay</button>
  </section>

  <!-- FORM -->
  <section id="form" class="page">
    <h2>Đăng ký tham gia VuTien Art Club</h2>

    <div class="form-group">
      <input type="text" id="name" placeholder=" "  required>
      <label for="name">Họ và tên *</label>
    </div>

    <div class="form-group">
      <input type="text" id="class" placeholder=" " required>
      <label for="class">Lớp *</label>
    </div>

    <div class="form-group">
      <input type="tel" id="phone" placeholder=" ">
      <label for="phone">Số điện thoại</label>
    </div>

    <div class="form-group">
      <input type="url" id="fb" placeholder=" " required>
      <label for="fb">Trang cá nhân Fb *</label>
    </div>

    <div class="form-group">
      <textarea id="reason" placeholder=" " rows="4" required></textarea>
      <label for="reason">Lý do bạn muốn gia nhập CLB</label>
    </div>

    <p class="note">
      Các mục có dấu <span class="required">*</span> là bắt buộc
    </p>

    <div class="form-buttons">
      <button class="secondary" onclick="goTo('home')">Quay lại</button>
      <button onclick="submitForm()">Gửi đăng ký</button>
    </div>
  </section>

  <!-- THANK YOU -->
  <section id="thanks" class="page">
    <h2>Cảm ơn bạn 🌿</h2>
    <p>Đơn đăng ký của bạn đã được gửi thành công.</p>
    <button onclick="goTo('home')">Về trang chủ</button>
  </section>

</div>

<script src="script.js"></script>

<script>
  // INTRO ANIMATION
  window.addEventListener("load", () => {
    setTimeout(() => {
      document.getElementById("intro").classList.add("hide");
      document.getElementById("app").classList.remove("hidden");
    }, 2200);
  });
</script>

</body>
</html>
