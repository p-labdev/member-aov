<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art of VuTien</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>


<div class="bg-image"></div>
<div class="overlay"></div>

<div id="app" >

  <section id="home" class="page active">
    <img 
      src="logo-vta.jpg"
      class="club-logo"
      alt="Logo"
    >
    <h1>VuTien Art Club</h1>
    <p>
      Sẵn sàng trở thành thành viên của gia đình Vũ Tiên Art Club chưa nào!
    </p>
    <p class="countdown-title">Kết thúc sau:</p>
    <div class="countdown">
      <div class="time-box"><span class="number days">123</span><span class="label">NGÀY</span></div>
      <div class="time-box"><span class="number hours">15</span><span class="label">GIỜ</span></div>
      <div class="time-box"><span class="number minutes">45</span><span class="label">PHÚT</span></div>
      <div class="time-box"><span class="number seconds">57</span><span class="label">GIÂY</span></div>

    </div>

    <button onclick="goTo('form')">Đăng ký ngay</button>
    <div class="expired-text" style="display:none; color:#ff6b6b; font-weight:600; margin-top:12px; line-height: 1.6;">
      Đăng ký đã hết hạn - dev by Quang Phuc<br>
      LH Facebook <a href="https://facebook.com/mrphuc28" target="_blank" style="color: #e590ff; text-decoration: underline;">Quang Phúc</a>
    </div>

  </section>


  <section id="form" class="page">
    <h2>Đơn Đăng ký</h2>

    <div class="form-group name-field">
      <input type="text" id="name" placeholder=" "  required>
      <label for="name">Họ và tên *</label>
    </div>

    <div class="form-group class-field">
      <input type="text" id="class" placeholder=" " required>
      <label for="class">Lớp *</label>
    </div>

    <div class="form-group phone-field">
      <input type="tel" id="phone" placeholder=" ">
      <label for="phone">Số điện thoại</label>
    </div>

    <div class="form-group fb-field">
      <input type="url" id="fb" placeholder=" " required>
      <label for="fb">Link TCN Facebook *</label>
    </div>

    <div class="form-group major-field">
      <select id="major" required>
        <option value="" disabled selected hidden></option>
        <option value="Chuyên môn">Ban Chuyên môn</option>
        <option value="Quản lý">Ban Quản lý</option>
        <option value="Truyền thông">Ban Truyền thông</option>
        <option value="Kỹ thuật">Ban Kỹ thuật</option>
      </select>
      <label for="major">Phân ban *</label>
    </div>

    <div class="form-group reason-field">
      <textarea id="reason" placeholder=" " required></textarea>
      <label for="reason">Lý do bạn muốn gia nhập CLB</label>
    </div>

    <p class="note">
      Các mục có dấu <span class="required">*</span> là bắt buộc
    </p>

    <div class="form-buttons">
      <button class="secondary" onclick="goTo('home')">Quay lại</button>
      <button onclick="submitForm()">Gửi đăng ký</button>
    </div>
  </section>


  <section id="thanks" class="page">
    <h2>Cảm ơn bạn 🌿</h2>
    <p>Đơn đăng ký của bạn đã được gửi thành công.</p>
    <button onclick="goTo('home')">Về trang chủ</button>
  </section>

</div>

<script src="script.js"></script>

</html>
